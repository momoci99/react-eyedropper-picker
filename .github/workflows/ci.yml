name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build library and demo
        run: pnpm build:demo

      # Minified + gzip size per entry; fails over budget (scripts/size.mjs).
      - name: Bundle size
        run: pnpm size

      # npm tarball must contain only the files whitelist (no agent files).
      - name: Check npm tarball contents
        working-directory: packages/react-eyedropper-picker
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path)
            const allowed = (p) =>
              p.startsWith("dist/") || ["README.md", "LICENSE", "package.json"].includes(p)
            const bad = files.filter((p) => !allowed(p))
            if (bad.length) {
              console.error("Unexpected files in tarball:\n" + bad.join("\n"))
              process.exit(1)
            }
            console.log(files.join("\n"))
          '
          rm pack.json

  # Playwright checks against the demo in real Chromium (desktop mouse + mobile touch)
  # and WebKit (desktop mouse, Safari's engine).
  # Runs the demo dev server itself; it uses library source, so no build needed.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Headless shell is enough for Chromium (tests run headless); --with-deps adds OS libraries.
      - name: Install Chromium and WebKit
        run: pnpm e2e:install --with-deps --only-shell

      - name: E2E
        run: pnpm e2e

      # Screenshots and traces of failed tests (open a trace with `npx playwright show-trace`).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: apps/demo/test-results
          retention-days: 7
