name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build library and demo
        run: pnpm build:demo

      # npm tarball must contain only the files whitelist (no agent files).
      - name: Check npm tarball contents
        working-directory: packages/react-eyedropper-picker
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path)
            const allowed = (p) =>
              p.startsWith("dist/") || ["README.md", "LICENSE", "package.json"].includes(p)
            const bad = files.filter((p) => !allowed(p))
            if (bad.length) {
              console.error("Unexpected files in tarball:\n" + bad.join("\n"))
              process.exit(1)
            }
            console.log(files.join("\n"))
          '
          rm pack.json
